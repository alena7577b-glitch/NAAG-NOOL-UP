<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="desk_grad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#402D1E"/>
      <stop offset="1" stop-color="#24170E"/>
    </linearGradient>
    <linearGradient id="page_grad" x1="150" y1="120" x2="450" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF8F5"/>
      <stop offset="1" stop-color="#EAE5DC"/>
    </linearGradient>
    <filter id="journal_shadow" x="120" y="90" width="360" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Wooden Desk Background -->
  <rect width="600" height="400" fill="url(#desk_grad)"/>
  <line x1="0" y1="100" x2="600" y2="100" stroke="#523B28" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="260" x2="600" y2="260" stroke="#523B28" stroke-width="2" opacity="0.4"/>

  <!-- Open Journal Spread -->
  <g filter="url(#journal_shadow)">
    <!-- Green Linen Journal Cover Backing -->
    <rect x="140" y="110" width="320" height="220" rx="6" fill="#3D4A36"/>
    <!-- Left Page -->
    <path d="M150 120 C220 122 280 120 295 125 L295 315 C280 310 220 312 150 310 Z" fill="url(#page_grad)"/>
    <!-- Right Page -->
    <path d="M305 125 C320 120 380 122 450 120 L450 310 C380 312 320 310 305 315 Z" fill="url(#page_grad)"/>
    <!-- Center Spine Shadow -->
    <rect x="295" y="120" width="10" height="195" fill="#C8C0B2" opacity="0.6"/>
  </g>

  <!-- Subtle Ruled Lines on Pages -->
  <line x1="170" y1="160" x2="275" y2="160" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="170" y1="185" x2="275" y2="185" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="170" y1="210" x2="275" y2="210" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="170" y1="235" x2="275" y2="235" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="170" y1="260" x2="275" y2="260" stroke="#D1C7B7" stroke-width="1"/>

  <line x1="325" y1="160" x2="430" y2="160" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="325" y1="185" x2="430" y2="185" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="325" y1="210" x2="430" y2="210" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="325" y1="235" x2="430" y2="235" stroke="#D1C7B7" stroke-width="1"/>
  <line x1="325" y1="260" x2="430" y2="260" stroke="#D1C7B7" stroke-width="1"/>

  <!-- Hands Writing & Emerald Green Sleeve -->
  <!-- Left Hand / Cuff -->
  <path d="M60 400 L120 280 C135 250 160 260 170 290 L180 400 Z" fill="#2D3B27"/>
  <path d="M125 275 C140 255 170 265 175 285 C180 300 165 315 150 310 Z" fill="#6B3F2A"/>
  <!-- Gold Bracelet -->
  <ellipse cx="140" cy="275" rx="14" ry="6" fill="none" stroke="#D49B4B" stroke-width="3"/>

  <!-- Right Hand with Pen -->
  <path d="M540 400 L460 270 C445 245 420 250 410 275 L380 400 Z" fill="#2D3B27"/>
  <path d="M430 255 C410 240 375 250 365 270 C355 290 380 305 400 300 Z" fill="#6B3F2A"/>
  <!-- Gold Pen -->
  <line x1="430" y1="200" x2="360" y2="280" stroke="#1E1C1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="200" x2="420" y2="212" stroke="#D49B4B" stroke-width="5"/>
  <circle cx="358" cy="282" r="2" fill="#D49B4B"/>
</svg>
